name: VibeCockpit
options:
  bundleIdPrefix: com.vibecockpit
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  swift-syntax:
    url: https://github.com/swiftlang/swift-syntax.git
    from: 600.0.0
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.9.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.0.0
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift.git
    from: 0.31.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 0.1.17
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: 3.31.3
  hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: 2.27.0

targets:
  VibeCockpit:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/VibeCockpit
      - Sources/StackCore
      - Sources/StackMCP
      - Sources/StackHTTP
    dependencies:
      - package: swift-syntax
        product: SwiftSyntax
      - package: swift-syntax
        product: SwiftParser
      - package: swift-sdk
        product: MCP
      - package: swift-crypto
        product: Crypto
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: swift-transformers
        product: Transformers
      - package: mlx-swift-lm
        product: MLXEmbedders
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: hummingbird
        product: Hummingbird
      - target: CSQLiteVec
    info:
      path: Sources/VibeCockpit/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Kokoro
        CFBundleName: Kokoro
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecockpit.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ENABLE_HARDENED_RUNTIME: YES
        # Apple silicon only: MLX needs it, and the vendored libgit2 is arm64.
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_SWIFT_FLAGS: -strict-concurrency=complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Modules/CSQLiteVec/include $(PROJECT_DIR)/Modules/CLibGit2"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Modules/CSQLiteVec/include $(PROJECT_DIR)/Vendor/libgit2/include"
        OTHER_LDFLAGS: "-L$(PROJECT_DIR)/Vendor/libgit2/lib -lgit2 -lz -liconv"

  CSQLiteVec:
    type: library.static
    platform: macOS
    sources:
      - Modules/CSQLiteVec/sqlite-vec.c
    headers:
      public:
        - Modules/CSQLiteVec/include
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: SQLITE_CORE=1 SQLITE_ENABLE_FTS5=1
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Modules/CSQLiteVec/include

  CLibGit2:
    type: library.static
    platform: macOS
    sources: []
    settings:
      base:
        OTHER_LDFLAGS: "-L$(PROJECT_DIR)/Vendor/libgit2/lib -lgit2 -lz -liconv"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Vendor/libgit2/include"

  VibeCockpitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/VibeCockpitTests
    dependencies:
      - target: VibeCockpit
