name: VibeCockpit
options:
  bundleIdPrefix: com.vibecockpit
  deploymentTarget:
    macOS: "26.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

packages:
  swift-syntax:
    url: https://github.com/swiftlang/swift-syntax.git
    from: 600.0.0
  swift-sdk:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    from: 0.9.0
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    from: 3.0.0
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift.git
    from: 0.31.0
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers.git
    from: 0.1.17

targets:
  VibeCockpit:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Sources/VibeCockpit
      - Sources/StackCore
      - Sources/StackMCP
    dependencies:
      - package: swift-syntax
        product: SwiftSyntax
      - package: swift-syntax
        product: SwiftParser
      - package: swift-sdk
        product: MCP
      - package: swift-crypto
        product: Crypto
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: swift-transformers
        product: Transformers
      - target: CSQLiteVec
    info:
      path: Sources/VibeCockpit/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vibecockpit.app
        SWIFT_STRICT_CONCURRENCY: complete
        OTHER_SWIFT_FLAGS: -strict-concurrency=complete
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "NO"
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: ""
        SWIFT_INCLUDE_PATHS: "$(PROJECT_DIR)/Modules/CSQLiteVec/include $(PROJECT_DIR)/Modules/CLibGit2"
        HEADER_SEARCH_PATHS: "$(PROJECT_DIR)/Modules/CSQLiteVec/include /opt/homebrew/Cellar/libgit2/1.9.7/include"
        OTHER_LDFLAGS: "-L/opt/homebrew/Cellar/libgit2/1.9.7/lib -lgit2"

  CSQLiteVec:
    type: library.static
    platform: macOS
    sources:
      - Modules/CSQLiteVec/sqlite-vec.c
    headers:
      public:
        - Modules/CSQLiteVec/include
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: SQLITE_CORE=1 SQLITE_ENABLE_FTS5=1
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/Modules/CSQLiteVec/include

  CLibGit2:
    type: library.static
    platform: macOS
    sources: []
    settings:
      base:
        OTHER_LDFLAGS: "-L/opt/homebrew/Cellar/libgit2/1.9.7/lib -lgit2"
        HEADER_SEARCH_PATHS: "/opt/homebrew/Cellar/libgit2/1.9.7/include /opt/homebrew/Cellar/libssh2/1.11.1_4/include /opt/homebrew/Cellar/openssl@3/3.6.4/include"

  VibeCockpitTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/VibeCockpitTests
    dependencies:
      - target: VibeCockpit
