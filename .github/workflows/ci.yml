# Runs on every push to main and on pull requests targeting main.
# Requires: macOS runner with Xcode 26 (macOS 26 SDK) and Homebrew.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pin to the Xcode release that ships the macOS 26 SDK.
      # Update this when a newer Xcode is available on the runner image.
      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep -E '^Xcode_2[6-9]|^Xcode_[3-9]' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Install build tools & libgit2
        run: brew install cmake xcodegen xcbeautify && ./Scripts/build-libgit2.sh

      # Cache the SPM build artefacts between runs.
      - name: Cache SPM build
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Run tests with coverage
        run: set -o pipefail; swift test --parallel --enable-code-coverage 2>&1 | tee /tmp/test-results.log

      - name: Coverage summary
        if: always()
        run: |
          BIN=$(find .build -name "KokoroTests.xctest" -type d | head -1)/Contents/MacOS/KokoroTests
          PROF=$(find .build -name "default.profdata" | head -1)
          if [ -f "$BIN" ] && [ -f "$PROF" ]; then
            echo "### Test Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            xcrun llvm-cov report "$BIN" -instr-profile="$PROF" -ignore-filename-regex=".build|Tests/|Modules/" | tail -n 15 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build macOS App bundle
        run: |
          xcodegen generate
          set -o pipefail
          xcodebuild build -scheme Kokoro -project Kokoro.xcodeproj -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -destination 'platform=macOS' 2>&1 | tee /tmp/xcodebuild.log | { command -v xcbeautify >/dev/null && xcbeautify || cat; }

      # Release build only matters for what ships from main; PRs skip it.
      - name: Build (release)
        if: github.event_name != 'pull_request'
        run: swift build -c release

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/*.log
          retention-days: 3

  # Stable single check name for `gh pr merge` / branch protection to key on.
  ci-gate:
    name: CI Gate
    if: always()
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.build-and-test.result }}" = "success"
