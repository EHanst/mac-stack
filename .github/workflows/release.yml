# Triggered by a version tag (e.g. v1.2.3). Builds, signs, notarizes and publishes the DMG.
# Untested until the secrets exist: run `DRY_RUN=1 ./scripts/release.sh` locally first.
#
# Required repository secrets:
#   DEVELOPER_ID_P12_BASE64   - base64 of the exported "Developer ID Application" certificate (.p12)
#   DEVELOPER_ID_P12_PASSWORD - password of that .p12
#   DEVELOPER_ID_APPLICATION  - certificate name, e.g. "Developer ID Application: Name (TEAMID)"
#   NOTARYTOOL_APPLE_ID       - Apple ID used for notarization
#   NOTARYTOOL_TEAM_ID        - 10-character Team ID
#   NOTARYTOOL_APP_PASSWORD   - app-specific password for notarytool
name: Release

on:
  push:
    tags:
      - 'v[0-9]*'

jobs:
  release:
    name: Build & Notarize
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          XCODE=$(ls /Applications | grep -E '^Xcode_2[6-9]|^Xcode_[3-9]' | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "/Applications/$XCODE/Contents/Developer"
          fi
          xcodebuild -version

      - name: Install build tools
        run: brew install cmake xcodegen xcbeautify && ./scripts/build-libgit2.sh

      - name: Import signing certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/release.keychain-db"; KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_APP_PASSWORD }}
        run: xcrun notarytool store-credentials notarytool --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APP_PASSWORD"

      - name: Build, sign, notarize
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARYTOOL_KEYCHAIN_PROFILE: notarytool
          VERSION: ${{ github.ref_name }}
        run: VERSION="${VERSION#v}" ./scripts/release.sh

      - name: Locate DMG
        id: dmg
        run: echo "path=$(ls build/*.dmg | head -1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Kokoro ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: ${{ steps.dmg.outputs.path }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
